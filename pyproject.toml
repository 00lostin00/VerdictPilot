[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "verdictpilot"
version = "0.2.0"
description = "A learning workspace for algorithms, code diagnosis, Agent engineering, and evidence-based practice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ding Liuan" }]
dependencies = [
  "fastapi>=0.115,<1",
  "openai-agents>=0.7,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]
browser = [
    "playwright>=1.50,<2",
]

[project.scripts]
verdictpilot = "verdictpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/verdictpilot"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
